# CCER tunnel: AppImage runtime cannot mount FUSE under NoNewPrivileges=yes.
# Keep systemd security protection; extract/run without FUSE instead.
[Service]
Environment=APPIMAGE_EXTRACT_AND_RUN=1
# Match visible_desktop.launch approved default directories.
Environment=CCER_INAPP_MEDIA_ROOT=%h/Videos
Environment=CCER_INAPP_EXPORT_ROOT=%h/Videos
