name: CCER Native Setup reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccer-native-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regressions:
    name: Python, docs and patch integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CCER
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media and speech regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          command -v espeak-ng
      - name: Instrumented unit tests and MCP evidence
        run: |
          python3 docs/audit_mcp_tests.py --write
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("docs/mcp-test-evidence.json").read_text())
          voice = next(t for t in report["tools"] if t["name"] == "ccer_voice_synthesize")
          assert any(e["layer"] == "dispatch" and e["outcome"] == "returned"
                     for e in voice["observedInPassingTests"]), "eSpeak test did not exercise real dispatch"
          assert report["suite"]["failures"] == report["suite"]["errors"] == 0
          assert report["summary"]["dispatchReturnedInPassingTest"] == report["summary"]["tools"]
          for tool in report["tools"]:
              if tool["name"] in ("ccer_desktop_status", "ccer_desktop_capture", "ccer_desktop_act"):
                  assert any(e["layer"] == "dispatch" and e["outcome"] == "returned"
                             and e["test"].endswith("test_mcp_desktop_roundtrip_with_simulated_slint_peer")
                             for e in tool["observedInPassingTests"]), tool["name"]
          print("MCP dispatch evidence:", report["summary"])
          print("Desktop evidence: simulated Slint peer, not live GUI acceptance.")
          PY
      - name: Upload MCP test evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-evidence
          path: docs/mcp-test-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Architecture diagram consistency
        run: python3 docs/render_architecture.py --check
      - name: Native patch SHA-256 integrity
        run: python3 -m ccer.native_setup --check

  native-source-reproduction:
    name: Native Rust patch reproduction (source only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout CCER
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact official Concat v0.2.8 source
        run: |
          mkdir -p .runtime
          git clone --filter=blob:none --branch v0.2.8 --single-branch https://github.com/jub0t/Concat.git .runtime/concat-official-cache
          test "$(git -C .runtime/concat-official-cache rev-parse HEAD)" = "79116bd0f9a103c633d888603ad27890e929dbdc"
      - name: Apply and verify all pinned CCER native patches
        run: |
          python3 -m ccer.native_setup --prepare --source .runtime/concat-official-cache
          python3 -m ccer.native_setup --verify
      - name: Verify idempotent repeat
        run: python3 -m ccer.native_setup --prepare --source .runtime/concat-official-cache

# Source reproduction only: no Cargo build or GUI certification is implied.
