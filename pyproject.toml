[build-system]
requires=["setuptools>=65"]
build-backend="setuptools.build_meta"

[project]
name="ccer-mcp"
version="0.1.0"
requires-python=">=3.10"
dependencies=[]
license={file="LICENSE"}
classifiers=["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]

[project.urls]
Homepage="https://github.com/jackjosias/ccer-mcp"
Repository="https://github.com/jackjosias/ccer-mcp"
Privacy="https://github.com/jackjosias/ccer-mcp/blob/main/PRIVACY.md"
Issues="https://github.com/jackjosias/ccer-mcp/issues"

[project.scripts]
ccer-mcp="ccer.cli:main"
ccer-concat="ccer.concat_setup:main"
ccer-native="ccer.native_setup:main"
ccer-direct-mcp="ccer.direct_cli:main"
ccer-tunnel-setup="ccer.tunnel_setup:main"

[tool.setuptools.packages.find]
include=["ccer*"]
